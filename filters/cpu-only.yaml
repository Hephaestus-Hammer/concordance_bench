# obfilter (seed 0 only): every size, CPU modules only (scanpy defaults + baseline). Needed because a filter
# bypasses the capability gate; without a filter, `ob run` on a CPU host prunes the rapids modules by itself.
picks:
  data:
    hao2021_10k: all
    hao2021_50k: all
    hao2021_100k: all
  input:
    hao_input: all
  pca:
    pc-scanpy: first
    pc-baseline: all
  knn:
    nn-scanpy: first
    nn-baseline: all
  cluster:
    cl-scanpy: first
    cl-baseline: first
