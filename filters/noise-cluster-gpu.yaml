# obfilter: seed noise of rapids Leiden: 20 cl-rapids seeds on seed-0 PCA and kNN.
# All sizes, every PCA and kNN module (the upstreams of noise-cluster.yaml plus rapids), GPU host.
# noise-cluster.yaml leaves the rapids modules out so it can run on a CPU host; this is its GPU
# counterpart. `all` = seeds 0-19, `first` = seed 0.
picks:
  data:
    hao2021_10k: all
    hao2021_50k: all
    hao2021_100k: all
  input:
    hao_input: all
  pca:
    pc-scanpy: first
    pc-baseline: all
    pc-rapids: all
  knn:
    nn-scanpy: first
    nn-baseline: all
    nn-rapids: all
  cluster:
    cl-rapids: all
