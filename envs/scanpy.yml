# from omni-scrna/scanpy@b98b70b envs/scanpy.yml
# the module's pixi export, plus denet (for the `stage` entrypoint)
name: scanpy
channels:
- conda-forge
- bioconda
- nodefaults
dependencies:
- python >=3.14.4,<3.15
- h5py >=3.16.0,<4
- scanpy >=1.12.1,<2
- anndata >=0.12.11,<0.13
- scipy >=1.17.1,<2
- numpy >=2.4.3,<3
- polars >=1,<2
- python-igraph >=0.11,<1
- leidenalg >=0.10,<1
- pynndescent ==0.6.0     # 0.7.0 returns csr_array, which scanpy 1.12.4 kNN cannot handle (getnnz)
- denet ==0.10.3          # added here: modules/stage.sh runs each module script under denet
- pip
- pip:
  - obkit>=0.0.3, <0.0.4
