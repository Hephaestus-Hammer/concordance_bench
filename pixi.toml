[workspace]
name = "concordance-bench"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
python = "3.12.*"
# analysis/
numpy = "*"
scipy = "*"
conda = ">=24.7.1,<26"
pandas = "*"
scikit-learn = "*"
anndata = "*"
h5py = "*"
matplotlib = "*"
pyyaml = "*"
denet = "==0.10.3"          # per-job CPU/memory/GPU traces

[pypi-dependencies]
omnibenchmark = "==0.7.0"              # the `ob` CLI; pinned because its CLI changes between releases
snakemake-executor-plugin-slurm = "*"  # for profiles/slurm
# analysis/resources.py: denet traces and per-phase attribution (obkit.prof); the fork until it is upstream
obkit = { git = "https://github.com/Hephaestus-Hammer/obkit.git", rev = "ce93f57f807e70ee7f4ab021c54d99e08346efd4", subdirectory = "python" }

[activation.env]
CONDA_PKGS_DIRS = "$PIXI_PROJECT_ROOT/.conda/pkgs"

[tasks]
validate = "ob validate plan benchmark.yaml"
dry = "ob run benchmark.yaml --dry"
report = "python analysis/report.py --from_out out --output_dir results/report"
# Re-generate envs/<env>.yml from pixi.lock (see "Module environments" below). Run after `pixi lock`.
lock-envs = """bash -c 'for e in data scanpy rapids; do pixi workspace export conda-environment -e $e --from-lock-file envs/$e.yml && sed -i "1i # GENERATED by pixi run lock-envs from pixi.lock: edit [feature.$e] in pixi.toml, not this file" envs/$e.yml || exit 1; done'"""

# --- Module environments -------------------------------------------------------------------
# One pixi environment per software_environment in benchmark.yaml, locked in pixi.lock with
# everything else. ob 0.7 only takes conda env files, so envs/<env>.yml are generated from the
# lock (`pixi run lock-envs`): every conda package pinned to version and build, every PyPI
# package to its version. Edit the features below, never envs/*.yml. They are never installed
# here (no-default-feature); Snakemake builds them from the exported files.

[feature.data]
channels = ["conda-forge"]
[feature.data.dependencies]   # omnibenchmark/omni-huggingface@dd042df
python = ">=3.10"
huggingface_hub = "*"

[feature.scanpy]
channels = ["conda-forge", "bioconda"]
[feature.scanpy.dependencies]   # omni-scrna/scanpy@b98b70b envs/scanpy.yml, plus denet
python = ">=3.14.4,<3.15"
h5py = ">=3.16.0,<4"
scanpy = ">=1.12.1,<2"
anndata = ">=0.12.11,<0.13"
scipy = ">=1.17.1,<2"
numpy = ">=2.4.3,<3"
polars = ">=1,<2"
python-igraph = ">=0.11,<1"
leidenalg = ">=0.10,<1"
pynndescent = "==0.6.0"   # 0.7.0 returns csr_array, which scanpy 1.12.4 kNN cannot handle (getnnz)
denet = "==0.10.3"        # modules/stage.sh runs each module script under denet
pip = "*"
[feature.scanpy.pypi-dependencies]
obkit = ">=0.0.3, <0.0.4"

[feature.rapids]
channels = ["conda-forge"]
[feature.rapids.dependencies]   # omni-scrna/rapids-singlecell@29b6614 envs/rapids-singlecell.yml, plus denet
python = ">=3.13,<3.14"
polars = ">=1,<2"
denet = "==0.10.3"
pip = "*"
[feature.rapids.pypi-dependencies]
rapids-singlecell-cu13 = { version = "==0.18.1", extras = ["rapids"] }   # the module pins 0.16.1; 0.18.1 is the newest release (docs/decisions.md)
obkit = ">=0.0.3, <0.0.4"
pytest = ">=8"

[environments]
data = { features = ["data"], no-default-feature = true }
scanpy = { features = ["scanpy"], no-default-feature = true }
rapids = { features = ["rapids"], no-default-feature = true }
