# obfilter (seed 0 only): quick end-to-end check that runs on any host: the 10k rung, scanpy defaults + baseline.
# A filter bypasses the capability gate, so GPU modules must be left out here explicitly.
picks:
  data:
    hao2021_10k: all
  input:
    hao_input: all
  pca:
    pc-scanpy: first
    pc-baseline: all
  knn:
    nn-scanpy: first
    nn-baseline: all
  cluster:
    cl-scanpy: first
    cl-baseline: first
